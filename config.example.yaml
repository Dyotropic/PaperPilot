# PaperPilot v2.1.0 示例配置；已有 config.yaml 不用此文件覆盖。
# ── LLM 模型服务（多模型，功能三）──
# provider 可选：deepseek / openai / anthropic / gemini / glm / kimi / qwen / ollama
# Gemini: provider: gemini, model: gemini-3.8-flash, API Key 从 Google AI Studio 获取。
# OpenAI: 新配置默认 gpt-6.1-sol；GPT-6 系列端点须支持 Responses API。
# 各家网页订阅并非通用 API 凭据；订阅接入边界见 USER_GUIDE.md §3.4。
# 旧版 deepseek: 配置节仍兼容：未设置 llm.provider 时自动回退到 old deepseek 的 key/model
llm:
  provider: deepseek        # 默认 DeepSeek
  api_key: "sk-your-key-here"   # 对应 provider 的 API Key；Ollama 官方云端需 Key，本地/私有端点可留空
  api_keys: {}              # 可选：设置页保存各服务商 Key；如 {deepseek: "sk-...", openai: "sk-..."}
  base_url: ""              # 留空用内置默认地址；第三方兼容镜像可在此覆盖
  model: deepseek-flash  # 主模型（DeepSeek V4.1 Flash）
  # 任务级模型覆盖（留空 = 用主 model）
  score_model: ""           # AI 精排打分专用
  chat_model: ""            # 对话输出专用
  reasoning_model: ""       # 非空才启用"两步推理"（先深度推理再生成），多数模型无需
  reasoning_output_reserve: 4096  # 不可关闭思考的新模型，追加思考输出预算；0=保留调用方总上限
embedding:
  local_model: paraphrase-multilingual-MiniLM-L12-v2
  cache_dir: ./cache/embedding
agent:
  usage_enabled: true      # 本地记录真实 token 计数与请求指纹；不保存提示词或密钥
  context_windows: {}      # 按服务商/模型覆盖容量，如 {deepseek: {deepseek-flash: 1000000}}
  auto_compact_ratio: 0.7  # 达到模型窗口的此比例时压缩；未知容量沿用 80000 token 阈值
  keep_recent_rounds: 2    # 压缩时保留最近完整轮次；短会话手动压缩可覆盖全部完整轮次
  loop:
    permission_mode: ask_edit # read_only / ask_edit / direct_edit；仅作用于长任务 Agent 工具
                          # 在右侧 Agent 输入区勾选长任务后直接发送，无需填写预算。
                          # 修改审批与缺信息问询以对话卡片呈现，批准/回复须明确提交。
                          # 不按累计时长/请求/token 暂停；旧额度配置不再生效，用量仍记录。
  team:
    enabled: true          # 主 Agent 按需派发只读子 Agent；模型端点需支持原生函数调用
    max_parallel: 3        # 同时工作人数，1–6；其它任务排队
    max_agents: 6          # 每轮最多独立子 Agent，1–6；仅同轮可复用标识追问
    max_batches: 3         # 每轮最多派发/追问批次，1–3；之后必须审查汇总
    timeout_seconds: 180   # 每个子任务的总超时（含读取与推理），10–600 秒
  image_support: {}       # 按服务商/模型声明图片能力，如 {openai: {my-vision-model: true}}
                         # 已确认的内置视觉模型默认支持；未知型号仍需核实后声明，false 可禁用
data_sources:
  arxiv: false
  openalex: true
  local_pdf: true
  # Europe PMC：生物医学+最新预印本，免 key 免配置；默认关，开启可降低漏检
  europepmc: false
  # OpenAlex API Key：用于鉴权/配额，实际额度以账户和服务端响应为准。
  # 无有效 Key 或额度不足时可能受限。
  # 注册：https://openalex.org → Sign in → API Key
  openalex_api_key: ""
search:
  max_results: 100
  top_k: 20
  ce_candidates: 20
  # 不同数据源同时检索；每个源内部仍按顺序分页、召回、补摘要
  parallel_sources: true
  # CE 精排结束后保留模型的空闲秒数（0 = 完成后释放，最高 3600）
  ce_idle_seconds: 300
  # 仅缓存成功翻译（内存，按服务商/端点/模型/原文隔离，0 = 不缓存）
  translation_cache_ttl_seconds: 3600
  # OpenAlex 明确返回 null 摘要时的缓存秒数（0 = 不缓存，最高 86400）
  openalex_absent_ttl_seconds: 3600
  # 带年份/作者/期刊筛选时，每个数据源最多翻页数（1-20）
  max_pages: 5
  # 三源普通/筛选召回与精确查找的单次请求超时秒数（1-120）
  # OpenAlex 摘要/引用补查、PDF/HTML 下载各自使用独立超时
  request_timeout: 15
  # DOI/arXiv ID/完整标题精确查找的最多显示条数（0-100）
  exact_max_results: 25
cache:
  dir: ./cache/api
  ttl_hours: 24
ui:
  # 以下三个窗口字段尚未接入；实际入口为 1200×750，标题读取应用版本。
  window_width: 1100
  window_height: 750
  title: PaperPilot
  theme: slate
  dark_mode: true
  pdf_render_scale: 2.5
